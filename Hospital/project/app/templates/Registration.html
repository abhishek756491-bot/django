{% extends 'base.html' %}
{% load static %}

{% block content %}

{% include 'navbar.html' %}

<<!-- पूरे पेज के लिए एक खूबसूरत रंग-बिरंगा (Gradient) बैकग्राउंड -->
<div class="container-fluid min-vh-100 d-flex align-items-center py-5" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #6b11ff 100%);">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                
                <!-- मुख्य कार्ड: रंगीन बॉर्डर और ग्लास जैसी चमक के साथ -->
                <div class="card shadow-lg border-0 rounded-4 overflow-hidden" style="backdrop-filter: blur(10px); background: rgba(255, 255, 255, 0.95); border: 2px solid #ff007f !important;">
                    
                    <!-- कार्ड का ऊपरी हिस्सा (Sunset Orange & Pink Gradient Header) -->
                    <div class="card-header text-white text-center py-4 border-0" style="background: linear-gradient(45deg, #ff416c, #ff4b2b);">
                        <h3 class="fw-bold mb-0" style="letter-spacing: 1px; text-shadow: 1px 1px 2px rgba(0,0,0,0.3);">✨ Join Us Today ✨</h3>
                        <p class="text-white-50 small mb-0 fw-medium">Fill the colorful form to start your journey</p>
                    </div>

                    <!-- कार्ड का मुख्य हिस्सा -->
                    <div class="card-body p-4 p-sm-5">
                        
                        <!-- रंग-बिरंगा सफलता संदेश (Alert) -->
                        {% if msg %}
                        <div class="alert text-center fw-bold border-0 shadow-sm py-2 mb-4" role="alert" style="background: linear-gradient(to right, #11998e, #38ef7d); color: white;">
                            <i class="fas fa-magic me-2"></i> {{msg}}
                        </div>
                        {% endif %}

                        <!-- Django फॉर्म -->
                        <form method="post" class="needs-validation">
                            {% csrf_token %}
                            
                            <!-- इनपुट बॉक्स का ब्लॉक -->
                            <div class="mb-3 django-bootstrap-form">
                                {{ form }}
                            </div>
                            
                            <!-- रंग-बिरंगा नियॉन स्टाइल सबमिट बटन -->
                            <div class="d-grid mt-4">
                                <button type="submit" class="btn text-white btn-lg fw-bold shadow rounded-3 py-2 dynamic-btn" style="background: linear-gradient(45deg, #00c6ff, #0072ff); border: none; transition: 0.3s ease;">
                                    <i class="fas fa-rocket me-2"></i> Register Now
                                </button>
                            </div>
                        </form>
                    </div>

                    <!-- कार्ड का निचला हिस्सा (Footer) -->
                    <div class="card-footer text-center py-3 border-0" style="background: #fff0f5;">
                        <span class="text-dark small fw-medium">Already a member? </span>
                        <!-- चमकीला पिंक/पर्पल लॉगिन लिंक -->
                        <a href="{% url 'login' %}" class="fw-bold text-decoration-none small" style="color: #ff416c;">
                            Login Here <i class="fas fa-heart ms-1"></i>
                        </a>
                    </div>

                </div>
                
            </div>
        </div>
    </div>
</div>





     
    
{% endblock %}
