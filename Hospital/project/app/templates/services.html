{% extends 'base.html' %}
{% load static %}

{% block content %}
 {% include 'navbar.html' %}
 <!-- कंटेनर में क्लास का नाम ठीक किया (pz-2 से px-2) -->
<div class="container py-5 px-2">
    
    <!-- 🌈 बिना एरर वाला शानदार रंग-बिरंगा हेडिंग ब्लॉक -->
    <div class="text-center mb-5 p-4 rounded-4 shadow-lg text-white" 
         style="background: linear-gradient(135deg, #7f00ff 0%, #ff007f 50%, #00f2fe 100%); box-shadow: 0 10px 25px rgba(127, 0, 255, 0.3) !important;">
        
        <!-- मुख्य हेडिंग (सफेद रंग में बोल्ड और क्लियर, पीछे काली हल्की परछाई) -->
        <h1 class="fw-black text-uppercase tracking-wider m-0" 
            style="font-weight: 900; font-size: calc(1.8rem + 1.2vw); text-shadow: 2px 4px 10px rgba(0,0,0,0.3);">
            ✨ Our Premium Services ✨
        </h1>
        
        <!-- नियॉन येलो ग्लो के साथ छोटी सब-हेडिंग -->
        <p class="fw-bold mt-2 text-uppercase mb-0" 
           style="color: #ccff00; letter-spacing: 2px; font-size: 0.95rem; text-shadow: 0 0 10px rgba(204,255,0,0.6);">
            Advanced Medical Care & Treatment Facilities
        </p>
    </div>
    
<div class="row row-cols-1 row-cols-md-3 g-4">

    {% for service in services %}
    <div class="col">
        <div class="card h-100 shadow">
            <img src="{{ service.image.url }}"
                 class="card-img-top"
                 style="height:200px; object-fit:cover;"
                 alt="{{ service.title }}">

            <div class="card-body">
                <h5 class="card-title">{{ service.title }}</h5>
                <p class="card-text">
                    {{ service.description }}
                </p>
            </div>
        </div>
    </div>
    {% endfor %}

</div>


{% endblock %}
