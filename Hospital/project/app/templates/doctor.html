{% extends 'base.html' %}
{% load static %}

{% block content %}

{% include 'navbar.html' %}
<div class="container py-5 px-2">
    <!-- मुख्य हेडिंग ब्लॉक -->
    <div class="text-center mb-5">
        <h1 class="fw-black text-uppercase d-inline-block" 
            style="font-weight: 900; font-size: calc(1.8rem + 1.2vw); background: linear-gradient(45deg, #00f2fe, #ff007f); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(2px 4px 8px rgba(127,0,255,0.3));">
            💥 Highly Qualified Team 💥
        </h1>
        <p class="fw-bold mt-2" style="color: #ccff00; letter-spacing: 2px; font-size: 0.95rem; text-shadow: 0 0 8px rgba(204,255,0,0.5);">
            OUR EXPERT MEDICAL HEROES
        </p>
    </div>

    <!-- डॉक्टर्स ग्रिड लेआउट -->
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">

      {% for doctor in doctors %}
      <div class="col">
            <!-- मुख्य कार्ड: डार्क बैकग्राउंड और नियॉन बॉर्डर/होवर इफेक्ट के साथ -->
            <div class="card h-100 border-0 shadow-lg overflow-hidden rounded-4 vibrant-doctor-card" 
                 style="background: linear-gradient(145deg, #1e0044 0%, #2d0066 100%); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); border: 2px solid rgba(255, 0, 127, 0.2) !important;">
                
                <!-- डॉक्टर की इमेज (हल्के नियॉन ओवरले इफेक्ट के साथ) -->
                <div class="position-relative overflow-hidden card-img-container">
                    <img src="{{ doctor.image.url }}"
                         class="card-img-top w-100"
                         style="height:280px; object-fit:cover; transition: transform 0.5s ease;"
                         alt="{{ doctor.name }}">
                    <div class="image-gradient-overlay" style="position: absolute; bottom: 0; left: 0; width: 100%; height: 40%; background: linear-gradient(to top, #1e0044, transparent);"></div>
                </div>

                <!-- कार्ड बॉडी -->
                <div class="card-body p-4 d-flex flex-column justify-content-between">
                      
                      <div class="doctor-info-block" style="padding: 0;">
                          
                          <!-- डॉक्टर का नाम: चमकीला सफेद रंग और बोल्ड लुक -->
                          <h3 class="doctor-name" style="font-weight: 800; color: #ffffff; font-size: 1.4rem; letter-spacing: -0.3px; margin-bottom: 8px; text-shadow: 1px 1px 3px rgba(0,0,0,0.5);">
                              {{ doctor.name }}
                          </h3>
                    
                          <!-- डिपार्टमेंट: सायन (Cyan) कलर का चमकदार कैप्सूल बैज -->
                          <div style="margin-bottom: 15px;">
                              <span class="dept-badge" style="background: linear-gradient(135deg, rgba(0, 242, 254, 0.15) 0%, rgba(0, 242, 254, 0.3) 100%); color: #00f2fe; font-weight: 700; font-size: 0.8rem; padding: 5px 14px; border-radius: 50px; text-transform: uppercase; letter-spacing: 1px; display: inline-block; border: 1px solid rgba(0, 242, 254, 0.4); box-shadow: 0 2px 10px rgba(0, 242, 254, 0.2);">
                                  <i class="fas fa-building" style="margin-right: 5px;"></i> {{ doctor.department }}
                              </span>
                          </div>
                  
                          <!-- स्पेशलाइजेशन: नियॉन येलो (Yellow) हाइलाइट के साथ -->
                          <p class="doctor-spec" style="color: rgba(255,255,255,0.85); font-size: 0.95rem; font-weight: 600; display: flex; align-items: center; gap: 10px; margin: 0;">
                              <span style="background: rgba(204, 255, 0, 0.2); color: #ccff00; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 1px solid rgba(204, 255, 0, 0.4); box-shadow: 0 2px 8px rgba(204, 255, 0, 0.2); min-width: 32px;">
                                  <i class="fas fa-user-md"></i>
                              </span> 
                              {{ doctor.specialization }}
                          </p>
                      </div>

                </div>
            </div>
        </div>
      {% endfor %}
    </div>
</div>

{% endblock %}
