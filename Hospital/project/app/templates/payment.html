{% extends 'base.html' %}
{% block content %}

<style>
    body{
        background:#f4f8fb;
    }

    .payment-card{
        max-width:430px;
        margin:70px auto;
        border:none;
        border-radius:20px;
        overflow:hidden;
        box-shadow:0 15px 40px rgba(0,0,0,.15);
    }

    .payment-header{
        background:linear-gradient(135deg,#0d6efd,#198754);
        color:#fff;
        text-align:center;
        padding:25px;
    }

    .fee-box{
        background:#f8f9fa;
        border-radius:15px;
        padding:20px;
        margin:20px 0;
    }

    .fee{
        font-size:50px;
        font-weight:bold;
        color:#198754;
    }

    #pay-btn{
        width:100%;
        border:none;
        border-radius:50px;
        padding:14px;
        background:linear-gradient(135deg,#198754,#0d6efd);
        color:white;
        font-size:18px;
        font-weight:bold;
        transition:.3s;
    }

    #pay-btn:hover{
        transform:translateY(-3px);
        box-shadow:0 10px 20px rgba(0,0,0,.25);
    }

    .razorpay-payment-button{
        display:none;
    }
</style>

<div class="container">

    <div class="card payment-card">

        <div class="payment-header">
            <h3>💳 Doctor Fee Payment</h3>
            <p class="mb-0">Secure Online Payment</p>
        </div>

        <div class="card-body text-center">

            <div class="fee-box">
                <h6 class="text-muted">Consultation Fee</h6>
                <div class="fee">₹500</div>
            </div>

            <form action="/payment/" method="POST">

                {% csrf_token %}

                <script
                    src="https://checkout.razorpay.com/v1/checkout.js"
                    data-key="{{ razorpay_key }}"
                    data-amount="{{ payment.amount }}"
                    data-currency="INR"
                    data-order_id="{{ payment.id }}"
                    data-buttontext="Pay"
                    data-name="Appointment"
                    data-description="Doctor Appointment Fee"
                    data-theme.color="#198754">
                </script>

                <button type="button" id="pay-btn">
                    💳 Pay Now
                </button>

            </form>

        </div>

    </div>

</div>

<script>

document.getElementById("pay-btn").addEventListener("click", function(){

    document.querySelector(".razorpay-payment-button").click();

});

</script>

{% endblock %}
